version: '3.8'

services:
  postgres:
    image: postgres:latest
    container_name: barber_shop_dev_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-alsha3er}
      POSTGRES_DB: ${DB_DATABASE:-barber_shop}
      TZ: ${TZ:-Africa/Cairo}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_DATABASE:-barber_shop}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - barber_network

volumes:
  postgres_data:
    driver: local

networks:
  barber_network:
    driver: bridge
